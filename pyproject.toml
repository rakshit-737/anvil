[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-dac"
dynamic = ["version"]
description = "Detection-as-code lifecycle: lint, test, measure, draft and monitor Sigma rules on real telemetry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["sigma", "detection-engineering", "detection-as-code", "mitre-attack", "siem", "soc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
sigma = ["pySigma>=0.11", "pySigma-backend-splunk", "pySigma-backend-elasticsearch",
         "pySigma-backend-kusto", "pySigma-backend-sqlite"]
evtx = ["evtx>=0.8"]
ml = ["scikit-learn>=1.3", "numpy>=1.24"]
fast = ["pyahocorasick>=2.0"]
plots = ["matplotlib>=3.7"]
llm = ["anthropic>=0.40"]

[project.scripts]
anvil = "anvil.cli:main"

[tool.setuptools]
packages = ["anvil"]

[tool.setuptools.dynamic]
version = { attr = "anvil.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["realdata: needs datasets from scripts/download_data.py (skipped when $ANVIL_DATA is absent)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["E501", "E731", "B023", "B905", "D100", "D105", "D107", "D401"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/baselines/*" = ["ALL"]
"!anvil/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
