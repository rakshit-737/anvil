name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detections:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint rules
        run: python -m anvil lint
      - name: Detection gate (TP/TN fixtures + FP corpus + SOC capacity)
        run: |
          python -m anvil synth --out telemetry/benign.jsonl
          python -m anvil test
      - name: Coverage report
        run: python -m anvil coverage --corpus telemetry/benign.jsonl
