name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly: Mermaid is loaded unpinned (mermaid@11) at view time

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt -e .
      - run: mkdocs build --strict
      - name: Check docs integrity
        run: |
          if grep -lE '^/./' docs/*.md; then echo "corrupted docs source"; exit 1; fi
          grep -q 'class="mermaid"' site/architecture/index.html
      - name: Render check in headless Chromium (Mermaid SVG, failed requests, console errors)
        run: |
          pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
          python -m http.server -d site 8000 >/dev/null 2>&1 &
          sleep 2
          python scripts/check_docs_render.py http://127.0.0.1:8000/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
