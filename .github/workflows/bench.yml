name: bench

# Full real-data benchmark on clean ubuntu runners: fresh, checksum-verified downloads
# (including the files local endpoint antivirus blocks on the dev laptop), the Linux/AWS
# stage, Linux telemetry recorded on this runner (auditd + Sysmon for Linux: a benign
# workload and a benign discovery-command emulation), and a real-backend cross-check
# against OpenSearch. The `report` job joins both jobs' results from this one run and
# renders SUMMARY.md, the figures, the dashboard and its screenshot; its `results`
# artefact is what gets committed, unmodified.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 0"   # weekly

permissions:
  contents: read

env:
  ANVIL_DATA: ${{ github.workspace }}/../data
  PYTHONUNBUFFERED: "1"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" -r requirements-bench.txt
      - name: Download (fresh, checksum-verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/download_data.py all nixcloud
      - name: Ingest benign evtx-baseline
        run: python -m anvil ingest --benign
      - name: Record live Linux telemetry on this runner (benign commands only)
        run: bash scripts/record_linux_live.sh
      - name: Assert the live Linux capture is not empty
        run: |
          for f in benign/auditd.log benign/sysmon_linux.log emulation/auditd.log emulation/sysmon_linux.log; do
            test -s "$ANVIL_DATA/linux-live/$f" || { echo "::error::empty live capture: $f"; exit 1; }
          done
          cat "$ANVIL_DATA"/linux-live/*/window.txt
      - name: Real-data tests
        run: python -m pytest -q -m realdata
      - name: Benchmark (all stages + Linux/AWS)
        shell: bash
        run: python benchmarks/bench.py all nixcloud --workers 4 2>&1 | tee bench.log
      - name: Assert every dataset was readable on the runner
        run: |
          python - <<'PY'
          import json
          o = json.load(open("results/otrf.json")); e = json.load(open("results/engine.json"))
          n = json.load(open("results/nixcloud.json"))
          print("otrf blocked:", o["files_blocked_by_av"], "engine unreadable:", e["anvil"].get("unreadable", 0))
          assert o["files_blocked_by_av"] == 0 and e["anvil"].get("unreadable", 0) == 0
          print("live emulation:", n.get("live_emulation"))
          assert n.get("live_emulation") and n["live_emulation"]["events"] > 0
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-results
          path: |
            results/
            bench.log

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[sigma,evtx,fast]" pysigma-backend-opensearch pysigma-pipeline-sysmon pysigma-pipeline-windows
      - name: Download SigmaHQ + evtx-baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/download_data.py sigma baseline
      - name: Ingest benign
        run: python -m anvil ingest --benign
      - name: Start OpenSearch (localhost only; no restart policy, so a crash fails the job)
        run: |
          docker run -d --name os -p 127.0.0.1:9200:9200 \
            -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true -e "OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g" \
            opensearchproject/opensearch:2.19.1
          for i in $(seq 60); do curl -fs localhost:9200/_cluster/health && break; sleep 5; done
      - name: OpenSearch vs ANVIL
        shell: bash
        run: python benchmarks/backend_opensearch.py 2>&1 | tee backend.log
      - name: OpenSearch log; fail on a restart, a dead node or an OutOfMemoryError
        if: always()
        run: |
          docker logs os > opensearch.log 2>&1 || true
          docker inspect -f 'status={{.State.Status}} restarts={{.RestartCount}} oom_killed={{.State.OOMKilled}} exit={{.State.ExitCode}}' os
          echo "OutOfMemoryError lines: $(grep -c OutOfMemoryError opensearch.log || true)"
          test "$(docker inspect -f '{{.RestartCount}}' os)" = 0
          test "$(docker inspect -f '{{.State.Status}}' os)" = running
          ! grep -q OutOfMemoryError opensearch.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-results
          path: |
            results/backend_opensearch.json
            backend.log
            opensearch.log

  report:
    needs: [bench, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e . "matplotlib>=3.7" "playwright==1.63.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-results
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-results
          path: .
      - name: Every results file comes from this run
        run: |
          python - <<'PY'
          import glob, json, os
          run = os.environ["GITHUB_RUN_ID"]
          for f in sorted(glob.glob("results/*.json")):
              d = json.load(open(f))
              meta = d.get("provenance") if isinstance(d, dict) else None
              if meta is None:  # the Navigator layer keeps provenance as layer metadata
                  meta = {m["name"]: m["value"] for m in d.get("metadata", [])}
              print(f, meta.get("ci_run"), meta.get("git_sha", "")[:10])
              assert meta.get("ci_run") == run and meta.get("git_sha") == os.environ["GITHUB_SHA"], f
          PY
      - name: SUMMARY.md, figures and dashboard from this run's results
        run: python benchmarks/bench.py report
      - name: Dashboard screenshot
        run: |
          python -m playwright install --with-deps chromium
          python scripts/screenshot_dashboard.py docs/dashboard.html docs/img/dashboard.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results
          path: |
            results/
            docs/img/
            docs/dashboard.html
