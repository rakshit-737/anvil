# Deliberately bad rule: plausible-looking, but floods the benign corpus.
# Used by `make demo` to show the FP / SOC-capacity guardrail blocking a merge.
title: Any PowerShell Execution
id: 6f1c2a0e-3b4d-4c1a-9e7f-0a1b2c3d4e99
status: experimental
level: high
author: ANVIL demo
description: Flags every PowerShell process start.
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
  condition: selection
falsepositives:
  - Basically everything
tests:
  true_positives:
    - {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell -enc AAAA'}
