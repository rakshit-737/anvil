title: PowerShell Encoded Command Execution
id: 6f1c2a0e-3b4d-4c1a-9e7f-0a1b2c3d4e01
status: stable
version: 2
level: high
author: ANVIL demo
description: Detects PowerShell launched with an encoded command argument, frequently used to obscure malicious script content.
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_enc:
    CommandLine|re: '(?i)\s-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{16,}'
  condition: all of selection_*
falsepositives:
  - Some management agents (SCCM) pass encoded commands
tests:
  true_positives:
    - {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQA'}
    - {Image: 'C:\Program Files\PowerShell\7\pwsh.exe', CommandLine: 'pwsh -EncodedCommand ZQBjAGgAbwAgAGgAaQAgAHQAaABlAHIAZQA='}
  true_negatives:
    - {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'powershell.exe -ExecutionPolicy Bypass -File build.ps1'}
    - {Image: 'C:\Windows\System32\cmd.exe', CommandLine: 'cmd /c echo -enc SQBFAFgAIAAoAE4AZQB3AC0A'}
