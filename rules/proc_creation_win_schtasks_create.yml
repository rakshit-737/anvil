title: Scheduled Task Created From Suspicious Location
id: 6f1c2a0e-3b4d-4c1a-9e7f-0a1b2c3d4e04
status: experimental
version: 1
level: medium
author: ANVIL demo
description: Detects schtasks /create where the task action points into user-writable directories such as AppData, Temp or Public.
references:
  - https://attack.mitre.org/techniques/T1053/005/
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  paths:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
  condition: selection and paths
falsepositives:
  - Per-user software updaters installed in AppData
tests:
  true_positives:
    - {Image: 'C:\Windows\System32\schtasks.exe', CommandLine: 'schtasks /create /sc minute /mo 5 /tn upd /tr C:\Users\Public\u.exe'}
  true_negatives:
    - {Image: 'C:\Windows\System32\schtasks.exe', CommandLine: 'schtasks.exe /query /fo LIST'}
