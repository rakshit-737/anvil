title: LSASS Memory Dump Via Comsvcs Or Procdump
id: 6f1c2a0e-3b4d-4c1a-9e7f-0a1b2c3d4e03
status: test
version: 1
level: critical
author: ANVIL demo
description: Detects process-creation patterns that dump LSASS memory using comsvcs.dll MiniDump or Sysinternals procdump.
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  sel_comsvcs:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs'
      - 'minidump'
  sel_procdump:
    CommandLine|contains|all:
      - ' -ma '
      - 'lsass'
  condition: 1 of sel_*
falsepositives:
  - Authorized incident-response memory collection
tests:
  true_positives:
    - {Image: 'C:\Windows\System32\rundll32.exe', CommandLine: 'rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump 624 C:\temp\l.dmp full'}
    - {Image: 'C:\Tools\procdump64.exe', CommandLine: 'procdump64.exe -accepteula -ma lsass.exe out.dmp'}
  true_negatives:
    - {Image: 'C:\Windows\System32\rundll32.exe', CommandLine: 'rundll32.exe shell32.dll,Control_RunDLL'}
